<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>19moment V91 FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
*{box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial;background:#0a0e14;color:#e6e6e6;padding:14px;margin:0}
#lock{position:fixed;inset:0;background:#0a0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#lock input{padding:14px 18px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:18px;text-align:center;margin:14px;width:240px}
#lock button{padding:12px 28px;border-radius:12px;border:none;background:#f59e0b;color:#000;font-weight:800;font-size:16px;cursor:pointer}
.card{border-radius:14px;padding:11px 13px;display:flex;min-height:100px;background:#1e293b}
</style></head><body>
<div id="lock">
<div style="font-size:18px;font-weight:900">🔒 MA(20/60/240)</div>
<div style="font-size:12px;color:#94a3b8;margin-top:8px">請輸入密碼</div>
<input id="pwd" type="password" placeholder="密碼">
<button id="enterBtn">進入</button>
<div id="lockMsg" style="color:#f87171;font-size:12px;margin-top:8px;display:none">密碼錯誤</div>
</div>
<div id="app" style="display:none"><h1>V91 已修復 - 雙嗶+紫</h1><p>密碼正確，JS語法錯誤已修復</p>
<button onclick="testBeep()">測試雙嗶提示音</button>
<button onclick="localStorage.clear();location.reload()">清除緩存重載</button>
<div id="cards"></div>
</div>
<script>
const PWD="19moment";
document.getElementById('enterBtn').onclick=tryEnter;
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter') tryEnter()});
function tryEnter(){
  const v=document.getElementById('pwd').value;
  if(v===PWD){ document.getElementById('lock').style.display='none'; document.getElementById('app').style.display='block'; testBeep(); }
  else{ document.getElementById('lockMsg').style.display='block'; }
}
function testBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(at){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.35, ctx.currentTime+at);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+at+0.4);
      o.start(ctx.currentTime+at);
      o.stop(ctx.currentTime+at+0.4);
    }
    beep(0); beep(0.6);
  }catch(e){ console.log(e); }
}
// 顏色映射測試
const normColor=(c)=>{ if(['藍紅','红蓝','藍+紅','蓝红','紅藍'].includes(c)) return '紫'; return c; };
console.log('FIXED V91 loaded, normColor 藍紅->', normColor('藍紅'));
</script>
</body></html>
