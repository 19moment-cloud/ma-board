name: 檢查卡片變色並Telegram通知

on:
  schedule:
    - cron: '0 * * * *'  # 每小時
  workflow_dispatch:  # 手動觸發

jobs:
  check-color:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝依賴
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests curl_cffi lxml --upgrade
          
      - name: 讀取舊顏色
        id: old
        run: |
          if [ -f docs/data.json ]; then
            python3 -c "
          import json, os
          try:
              with open('docs/data.json','r') as f:
                  data=json.load(f)
              # 假設 data 是 list 或 dict，提取 ticker 和 color
              colors={}
              if isinstance(data, list):
                  for item in data:
                      t=item.get('ticker') or item.get('code') or item.get('symbol')
                      c=item.get('color') or item.get('dot') or ''
                      if t: colors[t]=c
              elif isinstance(data, dict):
                  # 如果有 cards 字段
                  cards=data.get('cards') or data.get('data') or []
                  if isinstance(cards, list):
                      for item in cards:
                          t=item.get('ticker')
                          c=item.get('color','')
                          if t: colors[t]=c
                  else:
                      colors=data
              print('舊顏色數量', len(colors))
              with open('/tmp/old_colors.json','w') as out:
                  json.dump(colors, out)
          except Exception as e:
              print('讀舊失敗', e)
              open('/tmp/old_colors.json','w').write('{}')
            "
          else
            echo '{}' > /tmp/old_colors.json
          fi
          
      - name: 跑 V90 生成新 data
        run: |
          echo "開始跑 V90..."
          for i in 1 2 3; do
            echo "=== 第 $i 次嘗試 ==="
            if python cloud_board_final.py; then
              echo "V90 成功"
              break
            fi
            echo "失敗，60秒後重試..."
            sleep 60
          done
          ls -lh docs/data.json docs/index.html || echo "檢查文件"
          
      - name: 比對變色並發Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import json, os, requests, sys
          try:
              with open('/tmp/old_colors.json','r') as f:
                  old=json.load(f)
          except:
              old={}
          try:
              with open('docs/data.json','r') as f:
                  data=json.load(f)
          except:
              data=[]
          
          new_colors={}
          # 兼容你的 data.json 格式 - 根據實際格式調整
          # 這裡嘗試多種解析方式
          if isinstance(data, list):
              for item in data:
                  t=item.get('ticker') or item.get('code')
                  c=item.get('color') or item.get('dot') or item.get('ma_color') or ''
                  # 從你的卡片 class 推斷顏色 - 如果 data 裡有顏色字段直接用
                  if t:
                      # 如果有 trend 或 pct 判斷
                      if not c:
                          # 嘗試從其他字段推斷
                          c = item.get('color','未知')
                      new_colors[t]=c
          elif isinstance(data, dict):
              # 可能是 {ticker: color} 或 含 cards
              if 'cards' in data:
                  for item in data['cards']:
                      t=item.get('ticker')
                      if t:
                          new_colors[t]=item.get('color','')
              else:
                  # 嘗試遍歷
                  for k,v in data.items():
                      if isinstance(v, str):
                          new_colors[k]=v
                      elif isinstance(v, dict):
                          new_colors[k]=v.get('color','')
          
          # 如果 new_colors 還是空，嘗試從 docs 裡的 html 解析？ 暫時用 old 對比
          changes=[]
          for t, new_c in new_colors.items():
              old_c = old.get(t)
              if old_c and old_c != new_c and old_c != '' and new_c != '':
                  changes.append(f'{t} {old_c}→{new_c}')
          # 如果格式不兼容，至少通知有更新
          if not changes and old and new_colors and old != new_colors:
              # 強制用更寬鬆的對比
              for t in new_colors:
                  if old.get(t) and old.get(t)!=new_colors.get(t):
                      changes.append(f'{t} {old.get(t)}→{new_colors.get(t)}')
          
          print(f'舊: {len(old)} 新: {len(new_colors)} 變色: {len(changes)}')
          if changes:
              msg = '🎨 卡片變色通知\n' + '\n'.join(changes[:30])
              if len(changes)>30:
                  msg += f'\n...還有{len(changes)-30}隻'
              token=os.getenv('TELEGRAM_BOT_TOKEN')
              chat=os.getenv('TELEGRAM_CHAT_ID')
              if token and chat:
                  url=f'https://api.telegram.org/bot{token}/sendMessage'
                  try:
                      r=requests.post(url, json={'chat_id': chat, 'text': msg}, timeout=15)
                      print(r.text)
                  except Exception as e:
                      print('Telegram 失敗', e)
              else:
                  print('缺少 Telegram secrets')
              # 把變色寫出來供 Actions log 看
              with open('/tmp/changes.txt','w') as f:
                  f.write(msg)
          else:
              print('沒有變色')
          "
          
      - name: Commit 新 data.json 和 index.html - 修復更新時間
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add docs/data.json docs/index.html || true
          git diff --staged --quiet && echo "沒有變更" && exit 0
          git commit -m "auto update data.json and index.html"
          git push || (sleep 5 && git push) || echo "push failed"
