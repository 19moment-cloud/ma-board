name: 檢查卡片變色並Telegram通知

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝依賴
        run: |
          pip install yfinance pandas requests
          
      - name: 讀取舊顏色
        id: old
        run: |
          if [ -f docs/data.json ]; then
            python3 -c "
          import json
          try:
              with open('docs/data.json','r') as f:
                  data=json.load(f)
              colors={}
              def norm(c):
                  return '紫' if str(c).strip() in ['藍紅','红蓝','藍+紅','蓝红','紅藍'] else c
              if isinstance(data, list):
                  for item in data:
                      t=item.get('ticker') or item.get('code')
                      c=item.get('color','')
                      if t: colors[t]=norm(c)
              elif isinstance(data, dict):
                  if 'cards' in data:
                      for item in data['cards']:
                          t=item.get('ticker')
                          if t: colors[t]=norm(item.get('color',''))
                  else:
                      for k,v in data.items():
                          if isinstance(v, str):
                              colors[k]=norm(v)
                          elif isinstance(v, dict):
                              colors[k]=norm(v.get('color',''))
              print('舊顏色數量', len(colors))
              with open('/tmp/old_colors.json','w') as out:
                  json.dump(colors, out)
          except Exception as e:
              print('讀舊失敗', e)
              open('/tmp/old_colors.json','w').write('{}')
            "
          else
            echo '{}' > /tmp/old_colors.json
          fi
          
      - name: 跑 V91 生成新 data
        run: |
          python cloud_board_final.py || python cloud_board_final_v91.py || echo "run failed"
          ls -l docs/data.json || echo "no data.json"
          
      - name: 比對變色並發Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${secrets.TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID: ${secrets.TELEGRAM_CHAT_ID}
        run: |
          python3 -c "
          import json, os, requests
          try:
              with open('/tmp/old_colors.json','r') as f:
                  old=json.load(f)
          except:
              old={}
          try:
              with open('docs/data.json','r') as f:
                  data=json.load(f)
          except:
              data=[]
          
          new_colors={}
          # 兼容你的 data.json 格式 - 根據實際格式調整
          # 這裡嘗試多種解析方式
          def norm_color(c):
              if not c: return c
              c=str(c).strip()
              if c in ['藍紅','红蓝','藍+紅','藍紅 ','蓝红','紅藍']:
                  return '紫'
              return c
          
          if isinstance(data, list):
              for item in data:
                  t=item.get('ticker') or item.get('code')
                  c=item.get('color') or item.get('dot') or item.get('ma_color') or ''
                  if t:
                      new_colors[t]=norm_color(c)
          elif isinstance(data, dict):
              if 'cards' in data:
                  for item in data['cards']:
                      t=item.get('ticker')
                      if t:
                          new_colors[t]=norm_color(item.get('color',''))
              else:
                  for k,v in data.items():
                      if isinstance(v, str):
                          new_colors[k]=norm_color(v)
                      elif isinstance(v, dict):
                          new_colors[k]=norm_color(v.get('color',''))
          
          def norm(c):
              if not c: return c
              return '紫' if str(c).strip() in ['藍紅','红蓝','藍+紅','藍紅 ','蓝红','紅藍'] else c
          changes=[]
          for t, new_c in new_colors.items():
              old_c = old.get(t)
              old_c_n = norm(old_c) if old_c else old_c
              new_c_n = norm(new_c)
              if old_c_n and old_c_n != new_c_n and old_c_n != '' and new_c_n != '':
                  changes.append(f'{t} {old_c_n}→{new_c_n}')

          print(f'舊: {len(old)} 新: {len(new_colors)} 變色: {len(changes)}')
          if changes:
              msg = '🎨 卡片變色通知\n' + '\n'.join(changes[:30])
              if len(changes)>30:
                  msg += f'\n...還有{len(changes)-30}隻'
              token=os.getenv('TELEGRAM_BOT_TOKEN')
              chat=os.getenv('TELEGRAM_CHAT_ID')
              if token and chat:
                  url=f'https://api.telegram.org/bot{token}/sendMessage'
                  r=requests.post(url, json={'chat_id': chat, 'text': msg})
                  print(r.text)
              with open('/tmp/changes.txt','w') as f:
                  f.write(msg)
          else:
              print('沒有變色')
          "
          
      - name: Commit 新 data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data.json docs/index.html || true
          git diff --staged --quiet || git commit -m "auto update data.json [skip ci]"
          git push || echo "push failed"
